<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κουίζ: Ο Μύθος της Φθίας</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a3a 0%, #2c3e50 100%);
            color: #f5f5f5;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid rgba(212, 175, 55, 0.5);
        }

        .header h1 {
            font-size: 2.4rem;
            color: #d4af37;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
            margin-bottom: 8px;
        }

        .header h2 {
            font-size: 1.5rem;
            color: #e8c878;
            font-weight: normal;
        }

        .question-container {
            background-color: rgba(26, 42, 58, 0.9);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .question-number {
            color: #d4af37;
            font-size: 1.2rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .question-text {
            font-size: 1.6rem;
            line-height: 1.4;
            text-align: center;
            margin-bottom: 25px;
            color: #ffffff;
            padding: 0 10px;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option {
            background-color: rgba(52, 73, 94, 0.9);
            border: 2px solid #3a506b;
            border-radius: 12px;
            padding: 16px 18px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .option:hover:not(.disabled) {
            background-color: rgba(67, 97, 133, 0.9);
            border-color: #d4af37;
            transform: translateY(-3px);
        }

        .option.selected {
            background-color: rgba(41, 128, 185, 0.8);
            border-color: #3498db;
        }

        .option.correct {
            background-color: rgba(46, 204, 113, 0.8);
            border-color: #27ae60;
        }

        .option.incorrect {
            background-color: rgba(231, 76, 60, 0.8);
            border-color: #c0392b;
        }

        .option.disabled {
            cursor: default;
            opacity: 0.9;
        }

        .option-letter {
            background-color: #2c3e50;
            color: #f5f5f5;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .option.selected .option-letter {
            background-color: #2980b9;
        }

        .option.correct .option-letter {
            background-color: #27ae60;
        }

        .option.incorrect .option-letter {
            background-color: #c0392b;
        }

        .feedback {
            padding: 18px;
            border-radius: 12px;
            margin-top: 18px;
            font-size: 1.3rem;
            display: none;
            text-align: center;
            animation: fadeIn 0.5s;
        }

        .feedback.correct {
            background-color: rgba(46, 204, 113, 0.2);
            border: 2px solid #27ae60;
            color: #a8ffc9;
        }

        .feedback.incorrect {
            background-color: rgba(231, 76, 60, 0.2);
            border: 2px solid #c0392b;
            color: #ffb8b3;
        }

        .buttons-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 14px 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-width: 140px;
        }

        .btn i {
            margin-right: 8px;
        }

        .btn-next {
            background-color: #d4af37;
            color: #2c3e50;
        }

        .btn-next:hover:not(:disabled) {
            background-color: #e8c878;
            transform: translateY(-3px);
            box-shadow: 0 7px 14px rgba(212, 175, 55, 0.4);
        }

        .btn-restart {
            background-color: #3a506b;
            color: #f5f5f5;
        }

        .btn-restart:hover {
            background-color: #4a6a8b;
            transform: translateY(-3px);
        }

        .btn-back {
            background-color: #2c3e50;
            color: #f5f5f5;
        }

        .btn-back:hover:not(:disabled) {
            background-color: #3a506b;
            transform: translateY(-3px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results-container {
            text-align: center;
            padding: 30px;
            display: none;
        }

        .results-title {
            font-size: 2.5rem;
            color: #d4af37;
            margin-bottom: 25px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
        }

        .score-display {
            font-size: 4rem;
            color: #ffffff;
            margin: 25px 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: inline-block;
            padding: 15px 40px;
            border-radius: 20px;
            border: 4px solid #d4af37;
        }

        .score-text {
            font-size: 1.7rem;
            color: #e8c878;
            margin-bottom: 30px;
        }

        .message {
            font-size: 1.6rem;
            color: #ffffff;
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .answers-summary {
            text-align: left;
            margin-top: 25px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        .answer-item {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border-left: 5px solid #ddd;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .answer-item.correct {
            border-left-color: #27ae60;
            background-color: rgba(46, 204, 113, 0.1);
        }

        .answer-item.incorrect {
            border-left-color: #c0392b;
            background-color: rgba(231, 76, 60, 0.1);
        }

        .correct-answer-indicator {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #27ae60;
            color: white;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Βελτιστοποίηση για κινητά σε portrait (όλη μέρα) */
        @media (max-width: 767px) {
            body {
                padding: 10px;
                min-height: 100vh;
                justify-content: flex-start;
                padding-top: 20px;
            }
            
            .game-container {
                padding: 18px;
                border-radius: 15px;
                margin-top: 0;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .header h2 {
                font-size: 1.2rem;
            }
            
            .question-container {
                padding: 18px;
            }
            
            .question-text {
                font-size: 1.4rem;
                margin-bottom: 20px;
                line-height: 1.3;
            }
            
            .option {
                font-size: 1.1rem;
                padding: 14px 16px;
            }
            
            .option-letter {
                width: 32px;
                height: 32px;
                font-size: 1.1rem;
                margin-right: 10px;
            }
            
            .feedback {
                font-size: 1.2rem;
                padding: 15px;
            }
            
            .btn {
                padding: 12px 15px;
                font-size: 1.1rem;
                min-width: 120px;
            }
            
            .results-title {
                font-size: 2rem;
            }
            
            .score-display {
                font-size: 3rem;
                padding: 12px 30px;
            }
            
            .score-text {
                font-size: 1.4rem;
            }
            
            .message {
                font-size: 1.3rem;
            }
            
            .answers-summary {
                max-height: 300px;
            }
        }

        /* Βελτιστοποίηση για πολύ μικρές οθόνες (πχ iPhone SE) */
        @media (max-width: 375px) {
            .header h1 {
                font-size: 1.6rem;
            }
            
            .header h2 {
                font-size: 1.1rem;
            }
            
            .question-text {
                font-size: 1.3rem;
            }
            
            .option {
                font-size: 1rem;
                padding: 12px 14px;
            }
            
            .option-letter {
                width: 30px;
                height: 30px;
                font-size: 1rem;
                margin-right: 8px;
            }
            
            .btn {
                padding: 10px 12px;
                font-size: 1rem;
                min-width: 100px;
            }
            
            .score-display {
                font-size: 2.5rem;
                padding: 10px 25px;
            }
        }

        /* Βελτιστοποίηση για tablets σε portrait */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            .game-container {
                max-width: 95%;
                padding: 30px;
            }
            
            .question-text {
                font-size: 1.7rem;
            }
            
            .option {
                font-size: 1.4rem;
                padding: 18px 20px;
            }
            
            .buttons-container {
                gap: 15px;
            }
            
            .btn {
                padding: 16px 25px;
                font-size: 1.3rem;
            }
        }

        /* Βελτιστοποίηση για landscape σε κινητά και tablets */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 5px;
                justify-content: flex-start;
                min-height: auto;
            }
            
            .game-container {
                padding: 15px;
                margin: 5px 0;
                max-height: 95vh;
                overflow-y: auto;
            }
            
            .header {
                margin-bottom: 15px;
                padding-bottom: 10px;
            }
            
            .header h1 {
                font-size: 1.8rem;
                margin-bottom: 5px;
            }
            
            .header h2 {
                font-size: 1.2rem;
            }
            
            .question-container {
                padding: 15px;
                margin-bottom: 15px;
            }
            
            .question-number {
                font-size: 1rem;
                margin-bottom: 5px;
            }
            
            .question-text {
                font-size: 1.3rem;
                margin-bottom: 15px;
                line-height: 1.2;
            }
            
            .options-container {
                gap: 8px;
            }
            
            .option {
                padding: 10px 12px;
                font-size: 1.1rem;
            }
            
            .option-letter {
                width: 28px;
                height: 28px;
                font-size: 1rem;
                margin-right: 8px;
            }
            
            .feedback {
                padding: 10px;
                font-size: 1.1rem;
                margin-top: 10px;
            }
            
            .buttons-container {
                margin-top: 15px;
                gap: 8px;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 1rem;
                min-width: auto;
            }
            
            /* Για τα αποτελέσματα σε landscape */
            .results-container {
                padding: 15px;
            }
            
            .results-title {
                font-size: 1.8rem;
                margin-bottom: 15px;
            }
            
            .score-display {
                font-size: 2.5rem;
                margin: 15px 0;
                padding: 10px 20px;
            }
            
            .score-text {
                font-size: 1.2rem;
                margin-bottom: 15px;
            }
            
            .message {
                font-size: 1.1rem;
                margin-top: 15px;
                padding: 12px;
            }
            
            .answers-summary {
                margin-top: 15px;
                padding: 12px;
                max-height: 200px;
            }
            
            .answer-item {
                padding: 8px;
                margin-bottom: 8px;
                font-size: 0.9rem;
            }
        }

        /* Βελτιστοποίηση για tablets σε landscape */
        @media (min-width: 768px) and (max-height: 800px) and (orientation: landscape) {
            .game-container {
                padding: 20px;
                max-height: 90vh;
                overflow-y: auto;
            }
            
            .question-text {
                font-size: 1.5rem;
            }
            
            .option {
                padding: 14px 16px;
                font-size: 1.3rem;
            }
            
            .buttons-container {
                gap: 10px;
            }
        }

        /* Βελτιστοποίηση για desktop με μικρό ύψος */
        @media (min-width: 1024px) and (max-height: 700px) {
            .game-container {
                padding: 20px;
                max-height: 90vh;
                overflow-y: auto;
            }
            
            .question-text {
                font-size: 1.6rem;
            }
            
            .options-container {
                gap: 10px;
            }
            
            .option {
                padding: 14px 16px;
            }
        }

        /* Βελτιστοποίηση για μεγάλες οθόνες */
        @media (min-width: 1400px) {
            .game-container {
                max-width: 1100px;
                padding: 35px;
            }
            
            .question-text {
                font-size: 1.9rem;
            }
            
            .option {
                font-size: 1.5rem;
                padding: 20px 25px;
            }
            
            .option-letter {
                width: 40px;
                height: 40px;
                font-size: 1.4rem;
            }
            
            .btn {
                padding: 16px 30px;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Κουίζ: Ο Μύθος της Φθίας</h1>
            <h2>Το Έπος του Αχιλλέα και των Μυρμιδόνων</h2>
        </div>
        
        <div id="game-area">
            <div class="question-container">
                <div class="question-number">Ερώτηση <span id="question-num">1</span> από 20</div>
                <div class="question-text" id="question-text"></div>
                
                <div class="options-container" id="options-container">
                    <!-- Οι επιλογές θα εμφανίζονται εδώ μέσω JavaScript -->
                </div>
                
                <div class="feedback" id="feedback"></div>
            </div>
            
            <div class="buttons-container">
                <button class="btn btn-back" id="home-btn" onclick="window.location.href='https://conchr.github.io/Myth/'">
                    <i class="fas fa-home"></i> Αρχική
                </button>
                <button class="btn btn-back" id="prev-btn" disabled>
                    <i class="fas fa-arrow-left"></i> Προηγούμενη
                </button>
                <button class="btn btn-next" id="next-btn">
                    Επόμενη <i class="fas fa-arrow-right"></i>
                </button>
                <button class="btn btn-next" id="submit-btn" style="display: none;">
                    Υποβολή <i class="fas fa-check"></i>
                </button>
            </div>
        </div>
        
        <div class="results-container" id="results-container">
            <div class="results-title">Αποτελέσματα Κουίζ</div>
            <div class="score-display" id="final-score">0/20</div>
            <div class="score-text" id="score-text"></div>
            
            <div class="message" id="result-message"></div>
            
            <div id="answers-summary" class="answers-summary" style="display: none;">
                <h3 style="color: #d4af37; margin-bottom: 15px; text-align: center;">Ανάλυση Απαντήσεων</h3>
                <div id="answers-list"></div>
            </div>
            
            <div class="buttons-container" style="justify-content: center; margin-top: 25px;">
                <button class="btn btn-restart" id="restart-btn">
                    <i class="fas fa-redo"></i> Παίξτε ξανά
                </button>
                <button class="btn btn-back" id="show-answers-btn">
                    <i class="fas fa-list"></i> Απαντήσεις
                </button>
                <button class="btn btn-back" id="home-btn-2" onclick="window.location.href='https://conchr.github.io/Myth/'">
                    <i class="fas fa-home"></i> Αρχική
                </button>
            </div>
        </div>
    </div>

    <script>
        // Στοιχεία του παιχνιδιού
        const gameArea = document.getElementById('game-area');
        const resultsContainer = document.getElementById('results-container');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedback = document.getElementById('feedback');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const questionNumElement = document.getElementById('question-num');
        const finalScoreElement = document.getElementById('final-score');
        const scoreTextElement = document.getElementById('score-text');
        const resultMessageElement = document.getElementById('result-message');
        const restartBtn = document.getElementById('restart-btn');
        const showAnswersBtn = document.getElementById('show-answers-btn');
        const answersSummary = document.getElementById('answers-summary');
        const answersList = document.getElementById('answers-list');

        // Μεταβλητές του παιχνιδιού
        let currentQuestionIndex = 0;
        let score = 0;
        let correctAnswers = 0;
        let selectedOption = null;
        let gameCompleted = false;
        let userAnswers = new Array(20).fill(null);
        let questionsAnswered = new Array(20).fill(false);

        // Βάση δεδομένων ερωτήσεων για τον Μύθο της Φθίας
        const questions = [
            {
                question: "Γιατί ο Πηλέας κατέφυγε στη Φθία;",
                options: [
                    "Ήταν εξόριστος επειδή ηττήθηκε σε πόλεμο.",
                    "Επόπτευε την κατασκευή ενός νέου παλατιού.",
                    "Κυνηγήθηκε από τη μοίρα, έχοντας σκοτώσει τον αδελφό του.",
                    "Ακολουθούσε έναν χρησμό για να βρει έναν κρυμμένο θησαυρό."
                ],
                correct: 2,
                explanation: "Σωστά! Ο Πηλέας κατέφυγε στη Φθία κυνηγημένος από τη μοίρα, αφού είχε σκοτώσει τον αδελφό του."
            },
            {
                question: "Ποιος ήταν ο λαός που έφερε μαζί του ο Πηλέας στη Φθία;",
                options: [
                    "Οι Τρώες.",
                    "Οι Μυρμιδόνες.",
                    "Οι Αθηναίοι.",
                    "Οι Αργείοι."
                ],
                correct: 1,
                explanation: "Σωστά! Ο Πηλέας έφερε μαζί του τους Μυρμιδόνες, έναν λαό που δημιουργήθηκε από μυρμήγκια μεταμορφωμένα σε ανθρώπους."
            },
            {
                question: "Πώς δημιουργήθηκαν οι Μυρμιδόνες, σύμφωνα με τον θρύλο;",
                options: [
                    "Από τους βράχους που χτύπησε ο Ποσειδώνας με την τρίαινά του.",
                    "Ο Δίας μετέτρεψε τα μυρμήγκια της Αίγινας σε ανθρώπους.",
                    "Είναι απόγονοι των Τιτάνων που επέζησαν.",
                    "Γεννήθηκαν από το αίμα του Ουρανού."
                ],
                correct: 1,
                explanation: "Σωστά! Σύμφωνα με τον θρύλο, ο Δίας μετέτρεψε τα μυρμήγκια της Αίγινας σε ανθρώπους για να κατοικήσουν το έρημο νησί."
            },
            {
                question: "Γιατί η Νηρηίδα Θέτιδα αναγκάστηκε να παντρευτεί έναν θνητό, τον Πηλέα;",
                options: [
                    "Γιατί οι θεοί φοβήθηκαν ότι ο γιος της θα ήταν ισχυρότερος από τον πατέρα του.",
                    "Γιατί ο Πηλέας είχε κλέψει τα μυστικά της αθανασίας.",
                    "Γιατί έπρεπε να τιμωρηθεί για κακοποιητική πράξη.",
                    "Γιατί το ζήτησε ο ίδιος ο Δίας ως ανταμοιβή για τη γενναιότητά του."
                ],
                correct: 0,
                explanation: "Σωστά! Ένας χρησμός προείπε ότι η Θέτιδα θα γεννούσε έναν γιο που θα ξεπερνούσε σε δύναμη τον πατέρα του, γι' αυτό οι θεοί την ανάγκασαν να παντρευτεί θνητό."
            },
            {
                question: "Πού έλαβε χώρα ο πολυτελής γάμος του Πηλέα και της Θέτιδας;",
                options: [
                    "Στην κορυφή του Ολύμπου.",
                    "Στο Χειρώνιον Άντρον του Πηλίου.",
                    "Στις ακτές της Σκύρου.",
                    "Στο ιερό της Δωδώνης."
                ],
                correct: 1,
                explanation: "Σωστά! Ο γάμος τελέστηκε στο Χειρώνιον Άντρον του Πηλίου, και ήταν η τελευταία φορά που θεοί και άνθρωποι κάθισαν στο ίδιο τραπέζι."
            },
            {
                question: "Πώς προσπάθησε να κάνει τον Αχιλλέα αθάνατη η Θέτιδα, σύμφωνα με την τοπική παράδοση των Φαρσάλων;",
                options: [
                    "Τον έβαλε στον φούρνο του Ηφαίστου.",

                    "Τον βούτηξε στα νερά του ποταμού Απιδανού, κρατώντας τον από τη φτέρνα.",

        // Αρχικοποίηση του παιχνιδιού
        function initGame() {
            currentQuestionIndex = 0;
            score = 0;
            correctAnswers = 0;
            gameCompleted = false;
            userAnswers = new Array(questions.length).fill(null);
            questionsAnswered = new Array(questions.length).fill(false);
            
            gameArea.style.display = 'block';
            resultsContainer.style.display = 'none';
            answersSummary.style.display = 'none';
            
            showQuestion();
        }

        // Εμφάνιση της τρέχουσας ερώτησης
        function showQuestion() {
            const q = questions[currentQuestionIndex];
            questionText.textContent = q.question;
            questionNumElement.textContent = currentQuestionIndex + 1;
            
            // Καθαρισμός προηγούμενων επιλογών
            optionsContainer.innerHTML = '';
            feedback.style.display = 'none';
            feedback.className = 'feedback';
            nextBtn.disabled = true;
            submitBtn.disabled = true;
            selectedOption = null;
            
            // Ενημέρωση κουμπιών
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'flex';
            } else {
                nextBtn.style.display = 'flex';
                submitBtn.style.display = 'none';
            }
            
            // Προσθήκη των επιλογών
            const letters = ['Α', 'Β', 'Γ', 'Δ'];
            q.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                if (questionsAnswered[currentQuestionIndex]) {
                    optionElement.classList.add('disabled');
                }
                optionElement.innerHTML = `
                    <div class="option-letter">${letters[index]}</div>
                    <div class="option-text">${option}</div>
                `;
                
                // Εάν η ερώτηση έχει ήδη απαντηθεί, δείχνουμε τις σωστές/λάθος απαντήσεις
                if (questionsAnswered[currentQuestionIndex]) {
                    if (index === q.correct) {
                        optionElement.classList.add('correct');
                        const correctIndicator = document.createElement('div');
                        correctIndicator.className = 'correct-answer-indicator';
                        correctIndicator.textContent = '✓';
                        optionElement.appendChild(correctIndicator);
                    }
                    
                    if (userAnswers[currentQuestionIndex] === index && index !== q.correct) {
                        optionElement.classList.add('incorrect');
                    }
                } else {
                    optionElement.addEventListener('click', () => selectOption(index, optionElement));
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Εμφάνιση ανατροφοδότησης αν η ερώτηση έχει απαντηθεί
            if (questionsAnswered[currentQuestionIndex]) {
                showFeedback();
            }
        }

        // Επιλογή απάντησης από τον χρήστη
        function selectOption(optionIndex, optionElement) {
            if (questionsAnswered[currentQuestionIndex]) return;
            
            const q = questions[currentQuestionIndex];
            const allOptions = document.querySelectorAll('.option');
            
            // Αφαίρεση προηγούμενης επιλογής
            allOptions.forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Επισήμανση της επιλεγμένης απάντησης
            optionElement.classList.add('selected');
            selectedOption = optionIndex;
            userAnswers[currentQuestionIndex] = optionIndex;
            questionsAnswered[currentQuestionIndex] = true;
            
            // Απενεργοποίηση όλων των επιλογών
            allOptions.forEach(opt => {
                opt.classList.add('disabled');
                opt.removeEventListener('click', selectOption);
            });
            
            // Έλεγχος της απάντησης
            if (optionIndex === q.correct) {
                optionElement.classList.add('correct');
                feedback.textContent = `✅ Σωστό! ${q.explanation}`;
                feedback.classList.add('correct');
                feedback.style.display = 'block';
                score += 5;
                correctAnswers++;
            } else {
                optionElement.classList.add('incorrect');
                
                // Επισήμανση της σωστής απάντησης
                allOptions[q.correct].classList.add('correct');
                const correctIndicator = document.createElement('div');
                correctIndicator.className = 'correct-answer-indicator';
                correctIndicator.textContent = '✓';
                allOptions[q.correct].appendChild(correctIndicator);
                
                feedback.textContent = `❌ Λάθος! ${q.explanation}`;
                feedback.classList.add('wrong');
                feedback.style.display = 'block';
            }
            
            // Ενεργοποίηση των κουμπιών
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            submitBtn.disabled = false;
            
            // Εάν βρισκόμαστε στην τελευταία ερώτηση, ενεργοποιούμε το κουμπί Υποβολή
            if (currentQuestionIndex === questions.length - 1) {
                submitBtn.disabled = false;
            }
        }

        // Εμφάνιση ανατροφοδότησης για την τρέχουσα ερώτηση
        function showFeedback() {
            const q = questions[currentQuestionIndex];
            const userAnswer = userAnswers[currentQuestionIndex];
            
            if (userAnswer === null) return;
            
            const isCorrect = userAnswer === q.correct;
            
            feedback.textContent = isCorrect ? 
                `✅ Σωστό! ${q.explanation}` : 
                `❌ Λάθος! ${q.explanation}`;
            
            feedback.className = isCorrect ? 'feedback correct' : 'feedback wrong';
            feedback.style.display = 'block';
        }

        // Επόμενη ερώτηση
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                showQuestion();
            }
        }

        // Προηγούμενη ερώτηση
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
            }
        }

        // Υποβολή απαντήσεων
        function submitAnswers() {
            // Βεβαιωνόμαστε ότι όλες οι ερωτήσεις έχουν απαντηθεί
            const allAnswered = questionsAnswered.every(answer => answer === true);
            if (!allAnswered) {
                alert("Πρέπει να απαντήσετε όλες τις ερωτήσεις πριν υποβάλετε!");
                return;
            }
            
            endGame();
        }

        // Τερματισμός του παιχνιδιού και εμφάνιση αποτελεσμάτων
        function endGame() {
            gameCompleted = true;
            gameArea.style.display = 'none';
            resultsContainer.style.display = 'block';
            
            const percentage = Math.round((correctAnswers / questions.length) * 100);
            finalScoreElement.textContent = `${score}/${questions.length * 5}`;
            scoreTextElement.textContent = `Απαντήσατε σωστά ${correctAnswers} από τις ${questions.length} ερωτήσεις (${percentage}%)`;
            
            // Προσαρμοσμένο μήνυμα ανάλογα με το σκορ
            let message = "";
            if (percentage === 100) {
                message = "Εξαιρετικά! Είστε πραγματικός ειδικός στον μύθο της Φθίας και του Αχιλλέα! Μπράβο! 🏆";
            } else if (percentage >= 80) {
                message = "Πολύ καλά! Γνωρίζετε εξαιρετικά τον μύθο της Φθίας και του Αχιλλέα! 🌟";
            } else if (percentage >= 60) {
                message = "Καλή δουλειά! Έχετε καλή γνώση του μύθου της Φθίας! 👍";
            } else if (percentage >= 40) {
                message = "Έχετε κάποιες γνώσεις για τη Φθία και τον Αχιλλέα. Μπορείτε να διαβάσετε ξανά την παρουσίαση για να βελτιωθείτε! 📚";
            } else {
                message = "Θα χρειαστεί να μελετήσετε περισσότερο τον μύθο της Φθίας. Η παρουσίαση σίγουρα θα σας βοηθήσει! 🧠";
            }
            
            resultMessageElement.textContent = message;
        }

        // Προβολή λεπτομερών απαντήσεων
        function showAnswers() {
            answersSummary.style.display = 'block';
            answersList.innerHTML = '';
            
            questions.forEach((q, index) => {
                const answerItem = document.createElement('div');
                const userAnswer = userAnswers[index];
                const isCorrect = userAnswer === q.correct;
                
                answerItem.className = isCorrect ? 'answer-item correct' : 'answer-item incorrect';
                
                const letters = ['Α', 'Β', 'Γ', 'Δ'];
                const userAnswerText = userAnswer !== null 
                    ? `${letters[userAnswer]}) ${q.options[userAnswer]}`
                    : "Δεν απαντήθηκε";
                    
                const correctAnswerText = `${letters[q.correct]}) ${q.options[q.correct]}`;
                
                const resultIcon = isCorrect ? '✅' : '❌';
                
                answerItem.innerHTML = `
                    <strong style="color: #d4af37;">Ερώτηση ${index + 1}:</strong><br>
                    ${q.question}<br><br>
                    <strong>Η απάντησή σου:</strong> ${resultIcon} ${userAnswerText}<br>
                    <strong>Σωστή απάντηση:</strong> ${correctAnswerText}<br>
                    <em>${q.explanation}</em>
                `;
                
                answersList.appendChild(answerItem);
            });
            
            // Αλλαγή κειμένου του κουμπιού
            showAnswersBtn.innerHTML = '<i class="fas fa-times"></i> Κλείσιμο Απαντήσεων';
            showAnswersBtn.onclick = hideAnswers;
        }

        // Κλείσιμο λεπτομερών απαντήσεων
        function hideAnswers() {
            answersSummary.style.display = 'none';
            showAnswersBtn.innerHTML = '<i class="fas fa-list"></i> Απαντήσεις';
            showAnswersBtn.onclick = showAnswers;
        }

        // Επανεκκίνηση του παιχνιδιού
        function restartGame() {
            initGame();
        }

        // Προσθήκη event listeners
        prevBtn.addEventListener('click', prevQuestion);
        nextBtn.addEventListener('click', nextQuestion);
        submitBtn.addEventListener('click', submitAnswers);
        restartBtn.addEventListener('click', restartGame);
        showAnswersBtn.addEventListener('click', showAnswers);

        // Αρχικοποίηση κατά τη φόρτωση της σελίδας
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
